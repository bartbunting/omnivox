name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — macos-15 (arm64) for both targets; Apple's toolchain supports
          # cross-compilation to x86_64 natively. macos-13 (Intel) is unavailable.
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            name: macos-x64
          # Windows — native runner per arch (WinRT requires native compile)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-build-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\${{ matrix.target }}\release\omnivox.exe artifacts\omnivox.exe
          copy elisp\omnivox-voices.el artifacts\omnivox-voices.el

      - name: Prepare artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/omnivox artifacts/omnivox
          cp elisp/omnivox-voices.el artifacts/omnivox-voices.el
          chmod +x artifacts/omnivox

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          - os: windows-11-arm
            name: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.name }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.name }}-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.name }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.name }}-test-

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy -- -D warnings

  release:
    name: Create Release
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          for dir in omnivox-*/; do
            name="${dir%/}"
            suffix="${name#omnivox-}"
            archive="omnivox-${VERSION}-${suffix}"
            if [[ "$suffix" == *"windows"* ]]; then
              cd "$dir"
              zip "../${archive}.zip" omnivox.exe omnivox-voices.el
              cd ..
            else
              cd "$dir"
              tar czf "../${archive}.tar.gz" omnivox omnivox-voices.el
              cd ..
            fi
          done

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Omnivox ${{ github.ref_name }}
          body: |
            ## Omnivox ${{ github.ref_name }}

            Cross-platform Emacspeak speech server.

            ### Installation

            Download the archive for your platform, extract, and:

            ```bash
            # macOS
            cp omnivox ~/.cargo/bin/          # or /usr/local/bin/
            cp omnivox-voices.el /path/to/elisp/
            ```

            ```powershell
            # Windows — copy omnivox.exe into your Emacspeak servers directory
            copy omnivox.exe "$env:USERPROFILE\.emacspeak\servers\"
            ```

            See the project README for full init.el setup instructions.

            ### Binaries

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | Apple Silicon (M1/M2/M3/M4) | `omnivox-${{ github.ref_name }}-macos-arm64.tar.gz` |
            | macOS | Intel | `omnivox-${{ github.ref_name }}-macos-x64.tar.gz` |
            | Windows | x64 | `omnivox-${{ github.ref_name }}-windows-x64.zip` |
            | Windows | ARM64 | `omnivox-${{ github.ref_name }}-windows-arm64.zip` |

            macOS uses AVSpeechSynthesizer. Windows uses WinRT SpeechSynthesizer.
            espeak-ng is built in as a fallback on all platforms.

            See `sha256sums.txt` for verification checksums.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/sha256sums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
