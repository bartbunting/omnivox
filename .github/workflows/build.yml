name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ pkg-config autoconf automake libtool

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\${{ matrix.target }}\release\omnivox.exe artifacts\omnivox.exe
          copy elisp\omnivox-voices.el artifacts\omnivox-voices.el

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/omnivox artifacts/omnivox
          cp elisp/omnivox-voices.el artifacts/omnivox-voices.el
          chmod +x artifacts/omnivox

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ pkg-config autoconf automake libtool

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

  release:
    name: Create Release
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          for dir in omnivox-*/; do
            name="${dir%/}"
            suffix="${name#omnivox-}"
            archive="omnivox-${VERSION}-${suffix}"
            if [[ "$suffix" == *"windows"* ]]; then
              cd "$dir"
              zip "../${archive}.zip" omnivox.exe omnivox-voices.el
              cd ..
            else
              cd "$dir"
              tar czf "../${archive}.tar.gz" omnivox omnivox-voices.el
              cd ..
            fi
          done

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Omnivox ${{ github.ref_name }}
          body: |
            ## Omnivox ${{ github.ref_name }}

            Cross-platform Emacspeak speech server.

            ### Installation

            Download the archive for your platform, extract, and:

            ```bash
            # Install binary
            cp omnivox ~/.cargo/bin/   # or /usr/local/bin/, etc.

            # Install elisp (add to your init.el load-path)
            cp omnivox-voices.el /path/to/your/elisp/
            ```

            ### Binaries

            | Platform | File |
            |----------|------|
            | macOS ARM64 (Apple Silicon) | `omnivox-${{ github.ref_name }}-macos-arm64.tar.gz` |
            | macOS x64 (Intel) | `omnivox-${{ github.ref_name }}-macos-x64.tar.gz` |
            | Linux x64 | `omnivox-${{ github.ref_name }}-linux-x64.tar.gz` |
            | Linux ARM64 | `omnivox-${{ github.ref_name }}-linux-arm64.tar.gz` |
            | Windows x64 | `omnivox-${{ github.ref_name }}-windows-x64.zip` |
            | Windows ARM64 | `omnivox-${{ github.ref_name }}-windows-arm64.zip` |

            All binaries include espeak-ng as a built-in cross-platform fallback. macOS uses AVSpeechSynthesizer, Windows uses WinRT SpeechSynthesizer.

            See `sha256sums.txt` for verification checksums.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/sha256sums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
