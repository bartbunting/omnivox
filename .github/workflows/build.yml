name: CI

on:
  workflow_dispatch:
    inputs:
      draft_version:
        description: Existing draft release version to verify and publish (for example, 1.4.1)
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.draft_version == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check documentation links
        run: python3 tools/check_markdown_links.py

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.draft_version == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — pin the distribution that defines the release ABI baseline.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          # macOS — build and execute each target on its native architecture.
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          # Windows — native runner per arch (WinRT requires native compile)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config cmake clang libclang-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-build-

      - name: Build release binary
        run: >-
          python tools/build.py --release --target ${{ matrix.target }}
          --package omnivox-cli --features piper

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target\${{ matrix.target }}\release\omnivox.exe artifacts\omnivox.exe
          Copy-Item target\${{ matrix.target }}\release\LICENSE artifacts\LICENSE
          Copy-Item target\${{ matrix.target }}\release\LICENSING.md artifacts\LICENSING.md
          Copy-Item elisp\omnivox-voices.el artifacts\omnivox-voices.el
          Copy-Item -Recurse target\${{ matrix.target }}\release\espeak-ng-data artifacts\espeak-ng-data
          Copy-Item -Recurse target\${{ matrix.target }}\release\third-party-licenses artifacts\third-party-licenses

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/omnivox artifacts/omnivox
          cp target/${{ matrix.target }}/release/LICENSE artifacts/LICENSE
          cp target/${{ matrix.target }}/release/LICENSING.md artifacts/LICENSING.md
          cp elisp/omnivox-voices.el artifacts/omnivox-voices.el
          cp -R target/${{ matrix.target }}/release/espeak-ng-data artifacts/espeak-ng-data
          cp -R target/${{ matrix.target }}/release/third-party-licenses artifacts/third-party-licenses
          chmod +x artifacts/omnivox

      - name: Validate artifact payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts\espeak-ng-data\phontab -PathType Leaf)) { throw "missing espeak-ng-data/phontab" }
          if (-not (Test-Path artifacts\LICENSE -PathType Leaf)) { throw "missing project LICENSE" }
          if (-not (Test-Path artifacts\LICENSING.md -PathType Leaf)) { throw "missing component licensing map" }
          if (-not (Test-Path artifacts\third-party-licenses\eSpeak-NG-GPL-3.0.txt -PathType Leaf)) { throw "missing eSpeak NG license" }
          $env:ESPEAK_NG_DATA = (Resolve-Path artifacts).Path
          & artifacts\omnivox.exe --engine espeak --list-voices | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "packaged eSpeak voice discovery failed" }

      - name: Validate artifact payload (Unix)
        if: runner.os != 'Windows'
        run: |
          test -f artifacts/espeak-ng-data/phontab
          test -f artifacts/LICENSE
          test -f artifacts/LICENSING.md
          test -f artifacts/third-party-licenses/eSpeak-NG-GPL-3.0.txt

      - name: Smoke-test packaged eSpeak (native Unix)
        if: runner.os == 'macOS' || matrix.target == 'x86_64-unknown-linux-gnu'
        run: ESPEAK_NG_DATA="$PWD/artifacts" artifacts/omnivox --engine espeak --list-voices >/dev/null

      - name: Smoke-test packaged native macOS synthesis
        if: runner.os == 'macOS'
        run: |
          artifacts/omnivox --engine native --dump-wav "" native-smoke.wav "Omnivox release build verification."
          test "$(wc -c < native-smoke_raw.wav)" -gt 44
          test "$(wc -c < native-smoke.wav)" -gt 44

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.draft_version == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
          - os: windows-11-arm
            name: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config cmake clang libclang-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.name }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.name }}-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.name }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.name }}-test-

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build_piper_release:
    name: Build Piper Release ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            helper: omnivox-piper-helper
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            helper: omnivox-piper-helper
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            helper: omnivox-piper-helper
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            helper: omnivox-piper-helper.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang libclang-dev libasound2-dev pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: piper-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: piper-release-${{ runner.os }}-${{ matrix.target }}-

      - name: Build and stage companion
        run: python tools/build_piper.py --release

      - name: Recheck prepared inputs without network
        run: python tools/prepare_piper_inputs.py --target ${{ matrix.target }} --check

      - name: Lint native Piper crates
        run: >-
          cargo clippy --locked
          --package omnivox-piper-helper --package omnivox-piper-sys
          --all-targets --all-features -- -D warnings

      - name: Package and verify companion
        run: |
          python tools/package_piper.py
          python tools/verify_piper_release.py

      - name: Prepare locked CI-only synthesis model
        run: |
          python tools/prepare_piper_test_model.py
          python tools/prepare_piper_test_model.py --check

      - name: Stress persistent Piper helper session
        run: >-
          python tools/stress_helper.py
          target/release/piper/${{ matrix.helper }}
          --engine-id piper --iterations 25 --cancel-probe --require-acss rate
          --helper-arg=--model
          --helper-arg=target/piper-test-model/en_US-kristin-medium.onnx

      - name: Build Piper-enabled server
        run: python tools/build.py --release --package omnivox-cli --features piper

      - name: Verify real synthesis from relocated archive
        run: >-
          python tools/verify_piper_release.py
          --model target/piper-test-model/en_US-kristin-medium.onnx

      - name: Upload verified companion
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-piper-${{ matrix.name }}
          path: |
            target/release/omnivox-*-piper-${{ matrix.name }}.*
            target/release/piper-sha256sums.txt
          compression-level: 0
          if-no-files-found: error

  package_piper_source_release:
    name: Package Piper Source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: piper-source-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: piper-source-${{ runner.os }}-

      - name: Package and verify source artifact
        run: |
          python tools/package_piper_source.py
          python tools/verify_piper_source.py

      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-piper-source
          path: |
            target/release/omnivox-*-piper-source.tar.gz
            target/release/piper-source-sha256sums.txt
          compression-level: 0
          if-no-files-found: error

  package_release:
    name: Package Release
    needs: [format, build, test, build_piper_release, package_piper_source_release]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore Unix executable permissions
        run: chmod +x artifacts/omnivox-linux-x64/omnivox artifacts/omnivox-macos-*/omnivox

      - name: Validate release version
        id: release_version
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary_version="$(artifacts/omnivox-linux-x64/omnivox --version)"
          if [[ "$binary_version" != "omnivox $version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match $binary_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          for suffix in linux-x64 macos-arm64 macos-x64 windows-x64 windows-arm64; do
            dir="omnivox-${suffix}"
            archive="omnivox-${VERSION}-${suffix}"
            if [[ "$suffix" == *"windows"* ]]; then
              cd "$dir"
              zip -r "../${archive}.zip" omnivox.exe LICENSE LICENSING.md omnivox-voices.el espeak-ng-data third-party-licenses
              cd ..
            else
              cd "$dir"
              tar czf "../${archive}.tar.gz" omnivox LICENSE LICENSING.md omnivox-voices.el espeak-ng-data third-party-licenses
              cd ..
            fi
          done
          cp omnivox-piper-linux-x64/omnivox-*-piper-linux-x64.tar.gz .
          cp omnivox-piper-macos-arm64/omnivox-*-piper-macos-arm64.tar.gz .
          cp omnivox-piper-macos-x64/omnivox-*-piper-macos-x64.tar.gz .
          cp omnivox-piper-windows-x64/omnivox-*-piper-windows-x64.zip .
          cp omnivox-piper-source/omnivox-*-piper-source.tar.gz .

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum omnivox-*.tar.gz omnivox-*.zip > sha256sums.txt

      - name: Upload packaged release assets
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-release-assets
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/sha256sums.txt
          if-no-files-found: error

  create_draft_release:
    name: Create Draft Release
    needs: package_release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          name: omnivox-release-assets
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Omnivox ${{ github.ref_name }}
          body: |
            ## Omnivox ${{ github.ref_name }}

            Cross-platform Emacsvox/Emacspeak speech server.

            ### Changes

            See the [project changelog](https://github.com/bartbunting/omnivox/blob/${{ github.ref_name }}/CHANGELOG.md)
            for the changes in this release.

            ### Installation

            Download one archive and `sha256sums.txt`. Verify the archive before
            extraction; full Linux, macOS, and Windows commands are in the
            [deployment guide](https://github.com/bartbunting/omnivox/blob/${{ github.ref_name }}/.github/DEPLOYMENT.md).

            After extracting on Linux or macOS:

            ```bash
            binary_directory="$HOME/.local/bin"
            adapter_directory="$HOME/.emacs.d/lisp/omnivox"
            mkdir -p "$binary_directory/espeak-ng-data" \
              "$binary_directory/third-party-licenses" "$adapter_directory"
            install -m 755 omnivox "$binary_directory/omnivox"
            install -m 644 omnivox-voices.el "$adapter_directory/omnivox-voices.el"
            cp -R espeak-ng-data/. "$binary_directory/espeak-ng-data/"
            cp -R third-party-licenses/. "$binary_directory/third-party-licenses/"
            ```

            After extracting on Windows:

            ```powershell
            $destination = "$env:USERPROFILE\.emacspeak\servers"
            $directories = @(
              $destination,
              "$destination\espeak-ng-data",
              "$destination\third-party-licenses"
            )
            New-Item -ItemType Directory -Force $directories | Out-Null
            Copy-Item -Force omnivox.exe, omnivox-voices.el $destination
            Copy-Item -Recurse -Force espeak-ng-data\* "$destination\espeak-ng-data"
            Copy-Item -Recurse -Force third-party-licenses\* "$destination\third-party-licenses"
            ```

            `omnivox-voices.el` is the upstream Emacspeak adapter. Emacsvox uses
            its own bundled adapter. See the project README for `init.el` setup.
            `LICENSE` covers Omnivox-authored source; `LICENSING.md` explains
            the separately licensed adapter and statically linked eSpeak NG
            binary distribution.

            ### Binaries

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x64 (Ubuntu 24.04 ABI baseline) | `omnivox-${{ needs.package_release.outputs.version }}-linux-x64.tar.gz` |
            | macOS | Apple Silicon | `omnivox-${{ needs.package_release.outputs.version }}-macos-arm64.tar.gz` |
            | macOS | Intel | `omnivox-${{ needs.package_release.outputs.version }}-macos-x64.tar.gz` |
            | Windows | x64 | `omnivox-${{ needs.package_release.outputs.version }}-windows-x64.zip` |
            | Windows | ARM64 | `omnivox-${{ needs.package_release.outputs.version }}-windows-arm64.zip` |

            Linux uses eSpeak NG. macOS uses AVSpeechSynthesizer, and Windows
            uses WinRT SpeechSynthesizer. Every archive also contains the
            eSpeak NG runtime data generated by the matching dependency build
            and its third-party notices. This supports registered eSpeak
            fallback on macOS and Windows.

            The Linux archive requires Ubuntu 24.04-compatible glibc,
            libstdc++, libgcc, and ALSA runtime libraries.

            ### Optional Piper companions

            Piper is an optional out-of-process engine. Install the companion
            matching the generic archive by extracting its top-level `piper/`
            directory beside `omnivox` or `omnivox.exe`.

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x64 | `omnivox-${{ needs.package_release.outputs.version }}-piper-linux-x64.tar.gz` |
            | macOS | Apple Silicon | `omnivox-${{ needs.package_release.outputs.version }}-piper-macos-arm64.tar.gz` |
            | macOS | Intel | `omnivox-${{ needs.package_release.outputs.version }}-piper-macos-x64.tar.gz` |
            | Windows | x64 | `omnivox-${{ needs.package_release.outputs.version }}-piper-windows-x64.zip` |

            Voice models are user-supplied and are not included or endorsed by
            this release. Review a model's `MODEL_CARD` before configuring it.
            `omnivox-${{ needs.package_release.outputs.version }}-piper-source.tar.gz`
            contains the exact corresponding source and locked build inputs for
            all four companions.

            These binaries are not code-signed or notarized, so Gatekeeper or
            SmartScreen may warn. Verify `sha256sums.txt`; do not disable
            platform protections globally.
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/sha256sums.txt
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify_release:
    name: Verify Release ${{ matrix.name }}
    needs: [package_release, create_draft_release]
    runs-on: ${{ matrix.os }}
    if: >-
      always() &&
      (
        (
          startsWith(github.ref, 'refs/tags/v') &&
          needs.package_release.result == 'success' &&
          needs.create_draft_release.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.draft_version != ''
        )
      )
    permissions:
      # Draft releases are visible only to tokens with push-level access.
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.draft_version != '' && inputs.draft_version || needs.package_release.outputs.version }}
      RELEASE_TAG: ${{ inputs.draft_version != '' && format('v{0}', inputs.draft_version) || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            suffix: linux-x64
            extension: tar.gz
            platform: linux
            arch: x86_64
            engines: espeak
          - os: macos-15
            name: macos-arm64
            suffix: macos-arm64
            extension: tar.gz
            platform: macos
            arch: aarch64
            engines: espeak,native
          - os: macos-15-intel
            name: macos-x64
            suffix: macos-x64
            extension: tar.gz
            platform: macos
            arch: x86_64
            engines: espeak,native
          - os: windows-latest
            name: windows-x64
            suffix: windows-x64
            extension: zip
            platform: windows
            arch: x86_64
            engines: espeak,native
          - os: windows-11-arm
            name: windows-arm64
            suffix: windows-arm64
            extension: zip
            platform: windows
            arch: aarch64
            engines: espeak,native

    steps:
      - name: Checkout verification code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download draft release assets
        shell: bash
        run: gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "omnivox-$RELEASE_VERSION-${{ matrix.suffix }}.${{ matrix.extension }}" --pattern sha256sums.txt --dir downloaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded release archive
        shell: bash
        run: python tools/verify_release.py --archive "downloaded/omnivox-$RELEASE_VERSION-${{ matrix.suffix }}.${{ matrix.extension }}" --checksums downloaded/sha256sums.txt --version "$RELEASE_VERSION" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --engines "${{ matrix.engines }}"

  verify_piper_release:
    name: Verify Piper Release ${{ matrix.name }}
    needs: [package_release, create_draft_release]
    runs-on: ${{ matrix.os }}
    if: >-
      always() &&
      (
        (
          startsWith(github.ref, 'refs/tags/v') &&
          needs.package_release.result == 'success' &&
          needs.create_draft_release.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.draft_version != ''
        )
      )
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.draft_version != '' && inputs.draft_version || needs.package_release.outputs.version }}
      RELEASE_TAG: ${{ inputs.draft_version != '' && format('v{0}', inputs.draft_version) || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            suffix: linux-x64
            extension: tar.gz
          - os: macos-15
            name: macos-arm64
            suffix: macos-arm64
            extension: tar.gz
          - os: macos-15-intel
            name: macos-x64
            suffix: macos-x64
            extension: tar.gz
          - os: windows-2025
            name: windows-x64
            suffix: windows-x64
            extension: zip

    steps:
      - name: Checkout verification code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download draft Piper and generic assets
        shell: bash
        run: >-
          gh release download "$RELEASE_TAG"
          --repo "${{ github.repository }}"
          --pattern "omnivox-$RELEASE_VERSION-piper-${{ matrix.suffix }}.${{ matrix.extension }}"
          --pattern "omnivox-$RELEASE_VERSION-${{ matrix.suffix }}.${{ matrix.extension }}"
          --pattern sha256sums.txt
          --dir downloaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare locked CI-only synthesis model
        run: |
          python tools/prepare_piper_test_model.py
          python tools/prepare_piper_test_model.py --check

      - name: Verify exact downloaded Piper archive
        shell: bash
        run: >-
          python tools/verify_piper_release.py
          --archive "downloaded/omnivox-$RELEASE_VERSION-piper-${{ matrix.suffix }}.${{ matrix.extension }}"
          --omnivox-archive "downloaded/omnivox-$RELEASE_VERSION-${{ matrix.suffix }}.${{ matrix.extension }}"
          --checksums downloaded/sha256sums.txt
          --version "$RELEASE_VERSION"
          --model target/piper-test-model/en_US-kristin-medium.onnx

  verify_piper_source_release:
    name: Verify Piper Source Release
    needs: [package_release, create_draft_release]
    runs-on: ubuntu-24.04
    if: >-
      always() &&
      (
        (
          startsWith(github.ref, 'refs/tags/v') &&
          needs.package_release.result == 'success' &&
          needs.create_draft_release.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.draft_version != ''
        )
      )
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.draft_version != '' && inputs.draft_version || needs.package_release.outputs.version }}
      RELEASE_TAG: ${{ inputs.draft_version != '' && format('v{0}', inputs.draft_version) || github.ref_name }}

    steps:
      - name: Checkout verification code from release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download draft source asset
        shell: bash
        run: >-
          gh release download "$RELEASE_TAG"
          --repo "${{ github.repository }}"
          --pattern "omnivox-$RELEASE_VERSION-piper-source.tar.gz"
          --pattern sha256sums.txt
          --dir downloaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact downloaded source artifact
        shell: bash
        run: >-
          python tools/verify_piper_source.py
          --archive "downloaded/omnivox-$RELEASE_VERSION-piper-source.tar.gz"
          --checksums downloaded/sha256sums.txt
          --version "$RELEASE_VERSION"

  publish_release:
    name: Publish Verified Release
    needs: [verify_release, verify_piper_release, verify_piper_source_release]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.verify_release.result == 'success' &&
      needs.verify_piper_release.result == 'success' &&
      needs.verify_piper_source_release.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.draft_version != ''
        )
      )
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.draft_version != '' && format('v{0}', inputs.draft_version) || github.ref_name }}

    steps:
      - name: Publish draft release
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
