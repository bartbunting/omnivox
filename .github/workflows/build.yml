name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — macos-15 (arm64) for both targets; Apple's toolchain supports
          # cross-compilation to x86_64 natively. macos-13 (Intel) is unavailable.
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            name: macos-x64
          # Windows — native runner per arch (WinRT requires native compile)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-build-

      - name: Build release binary
        run: python tools/build.py --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target\${{ matrix.target }}\release\omnivox.exe artifacts\omnivox.exe
          Copy-Item elisp\omnivox-voices.el artifacts\omnivox-voices.el
          Copy-Item -Recurse target\${{ matrix.target }}\release\espeak-ng-data artifacts\espeak-ng-data
          Copy-Item -Recurse target\${{ matrix.target }}\release\third-party-licenses artifacts\third-party-licenses

      - name: Prepare artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/omnivox artifacts/omnivox
          cp elisp/omnivox-voices.el artifacts/omnivox-voices.el
          cp -R target/${{ matrix.target }}/release/espeak-ng-data artifacts/espeak-ng-data
          cp -R target/${{ matrix.target }}/release/third-party-licenses artifacts/third-party-licenses
          chmod +x artifacts/omnivox

      - name: Validate artifact payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts\espeak-ng-data\phontab -PathType Leaf)) { throw "missing espeak-ng-data/phontab" }
          if (-not (Test-Path artifacts\third-party-licenses\eSpeak-NG-GPL-3.0.txt -PathType Leaf)) { throw "missing eSpeak NG license" }
          $env:ESPEAK_NG_DATA = (Resolve-Path artifacts).Path
          & artifacts\omnivox.exe --engine espeak --list-voices | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "packaged eSpeak voice discovery failed" }

      - name: Validate artifact payload (macOS)
        if: runner.os == 'macOS'
        run: |
          test -f artifacts/espeak-ng-data/phontab
          test -f artifacts/third-party-licenses/eSpeak-NG-GPL-3.0.txt

      - name: Smoke-test packaged eSpeak (macOS ARM64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: ESPEAK_NG_DATA="$PWD/artifacts" artifacts/omnivox --engine espeak --list-voices >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          - os: windows-11-arm
            name: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.name }}-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.name }}-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.name }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.name }}-test-

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked -- -D warnings

  release:
    name: Create Release
    needs: [format, build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          for dir in omnivox-*/; do
            name="${dir%/}"
            suffix="${name#omnivox-}"
            archive="omnivox-${VERSION}-${suffix}"
            if [[ "$suffix" == *"windows"* ]]; then
              cd "$dir"
              zip -r "../${archive}.zip" omnivox.exe omnivox-voices.el espeak-ng-data third-party-licenses
              cd ..
            else
              cd "$dir"
              tar czf "../${archive}.tar.gz" omnivox omnivox-voices.el espeak-ng-data third-party-licenses
              cd ..
            fi
          done

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Omnivox ${{ github.ref_name }}
          body: |
            ## Omnivox ${{ github.ref_name }}

            Cross-platform Emacsvox/Emacspeak speech server.

            ### Installation

            Download the archive for your platform, extract, and:

            ```bash
            # macOS
            cp omnivox ~/.cargo/bin/          # or /usr/local/bin/
            mkdir -p ~/.cargo/bin/espeak-ng-data ~/.cargo/bin/third-party-licenses
            cp -R espeak-ng-data/. ~/.cargo/bin/espeak-ng-data/
            cp -R third-party-licenses/. ~/.cargo/bin/third-party-licenses/
            cp omnivox-voices.el /path/to/elisp/
            ```

            ```powershell
            # Windows — keep the binary, data, and notices together
            $destination = "$env:USERPROFILE\.emacspeak\servers"
            copy omnivox.exe $destination
            New-Item -ItemType Directory -Force "$destination\espeak-ng-data", "$destination\third-party-licenses" | Out-Null
            Copy-Item -Recurse -Force espeak-ng-data\* "$destination\espeak-ng-data"
            Copy-Item -Recurse -Force third-party-licenses\* "$destination\third-party-licenses"
            ```

            See the project README for full init.el setup instructions.

            ### Binaries

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | Apple Silicon (M1/M2/M3/M4) | `omnivox-VERSION-macos-arm64.tar.gz` |
            | macOS | Intel | `omnivox-VERSION-macos-x64.tar.gz` |
            | Windows | x64 | `omnivox-VERSION-windows-x64.zip` |
            | Windows | ARM64 | `omnivox-VERSION-windows-arm64.zip` |

            `VERSION` is the tag without its leading `v`; tag `v1.3.0`, for
            example, produces filenames beginning `omnivox-1.3.0-`.

            macOS uses AVSpeechSynthesizer. Windows uses WinRT SpeechSynthesizer.
            Every archive also contains the eSpeak NG runtime data generated
            by the matching dependency build and its third-party notices, so
            the compiled eSpeak fallback works from the extracted directory.

            See `sha256sums.txt` for verification checksums.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/sha256sums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
