name: Piper Native Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piper-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: Stage ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake clang libclang-dev libasound2-dev pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: piper-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: piper-${{ runner.os }}-${{ matrix.target }}-

      - name: Build and stage companion
        run: python tools/build_piper.py --release

      - name: Recheck prepared inputs without network
        run: python tools/prepare_piper_inputs.py --target ${{ matrix.target }} --check

      - name: Upload staged companion
        uses: actions/upload-artifact@v4
        with:
          name: omnivox-piper-${{ matrix.name }}
          path: target/release/piper/
          if-no-files-found: error
