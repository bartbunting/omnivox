[package]
name = "omnivox-tts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Opt-in piper neural TTS backend. Requires cmake, a C++17 compiler, and
# network access on first build to download onnxruntime + piper-phonemize.
piper = ["omnivox-piper-sys"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
once_cell.workspace = true
rubato = "0.16"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# espeak-ng (always compiled in as cross-platform fallback)
espeak-rs-sys = { version = "0.1", features = ["compile-espeak-intonations"] }

# piper neural TTS (optional — enabled with --features piper)
omnivox-piper-sys = { path = "../omnivox-piper-sys", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_SpeechSynthesis",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }

[build-dependencies]
cc = "1"
