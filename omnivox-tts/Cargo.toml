[package]
name = "omnivox-tts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["espeak"]
# The main server keeps eSpeak enabled. Native engine helpers can disable it to
# avoid loading a second copy of eSpeak into one process.
espeak = ["dep:espeak-rs-sys"]
# Opt-in helper-local Piper adapter. The main server does not enable this
# feature. Requires CMake, a C++17 compiler, and currently requires network
# access on the first build for libpiper's eSpeak and ONNX Runtime inputs.
piper = ["omnivox-piper-sys"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
omnivox-audio = { path = "../omnivox-audio" }

# eSpeak NG backend (enabled by default; supported builds stage its runtime data)
espeak-rs-sys = { version = "0.1", features = ["compile-espeak-intonations"], optional = true }

# Piper neural TTS for the out-of-process helper only
omnivox-piper-sys = { path = "../omnivox-piper-sys", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_SpeechSynthesis",
    "Media_Core",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }

[build-dependencies]
cc = "1"
