[package]
name = "omnivox-piper-sys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Declares this crate owns the "piper" native library — prevents duplicate linking.
links = "piper"

[lib]
name = "omnivox_piper_sys"

[features]
# Opt-in native acceptance test; requires reviewed model assets and the built
# Piper runtime on the test process's library search path.
native-tests = []

[[test]]
name = "lifecycle"
required-features = ["native-tests"]

[build-dependencies]
bindgen = "0.69"
