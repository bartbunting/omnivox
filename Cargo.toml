[workspace]
resolver = "2"
members = [
    "omnivox-core",
    "omnivox-tts",
    "omnivox-audio",
    "omnivox-cli",
    "omnivox-helper-host",
    "omnivox-flite-helper",
    "omnivox-flite-sys",
    "omnivox-piper-helper",
    "omnivox-piper-sys",
    "omnivox-rhvoice-helper",
    "omnivox-rutts-helper",
    "omnivox-rutts-sys",
    "omnivox-tgspeechbox-helper",
    "omnivox-tgspeechbox-sys",
]
# Normal builds compile the helper protocol library and its tests, but not the
# Piper executable or native library. `make build-piper` prepares verified
# native inputs, builds the helper with CMake, and stages its isolated runtime
# beside the main binary.
default-members = [
    "omnivox-core",
    "omnivox-tts",
    "omnivox-audio",
    "omnivox-cli",
    "omnivox-helper-host",
    "omnivox-piper-helper",
    "omnivox-rhvoice-helper",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[workspace.package]
version = "1.7.0"
edition = "2021"
authors = ["Robert Melton <rmelton@users.noreply.github.com>"]
license = "MIT"
