[workspace]
resolver = "2"
members = [
    "omnivox-core",
    "omnivox-tts",
    "omnivox-audio",
    "omnivox-cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
once_cell = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Robert Melton <rmelton@users.noreply.github.com>"]
license = "MIT"
