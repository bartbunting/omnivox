[workspace]
resolver = "2"
members = [
    "omnivox-core",
    "omnivox-tts",
    "omnivox-audio",
    "omnivox-cli",
    "omnivox-piper-sys",
]
# Normal builds (cargo build / make build) only compile these crates.
# omnivox-piper-sys is excluded because its build requires cmake + network
# access to download onnxruntime on first use. Build it explicitly with:
#   cargo build -p omnivox-piper-sys
# or via the piper feature:
#   cargo build --features piper -p omnivox-cli
default-members = [
    "omnivox-core",
    "omnivox-tts",
    "omnivox-audio",
    "omnivox-cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[workspace.package]
version = "1.3.0"
edition = "2021"
authors = ["Robert Melton <rmelton@users.noreply.github.com>"]
license = "MIT"

