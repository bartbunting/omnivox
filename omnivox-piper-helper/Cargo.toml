[package]
name = "omnivox-piper-helper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
piper = ["omnivox-tts/piper", "dep:omnivox-piper-sys"]

[[bin]]
name = "omnivox-piper-helper"
path = "src/main.rs"
required-features = ["piper"]

[dependencies]
omnivox-tts = { path = "../omnivox-tts", default-features = false }
omnivox-helper-host = { path = "../omnivox-helper-host" }
omnivox-piper-sys = { path = "../omnivox-piper-sys", optional = true }
