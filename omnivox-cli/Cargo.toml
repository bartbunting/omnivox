[package]
name = "omnivox-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Enable discovery of the out-of-process Piper helper. Native Piper code is
# linked only into `omnivox-piper-helper`, never into the speech server.
piper = []

[[bin]]
name = "omnivox"
path = "src/main.rs"

[dependencies]
omnivox-core = { path = "../omnivox-core" }
omnivox-tts = { path = "../omnivox-tts" }
omnivox-audio = { path = "../omnivox-audio" }
anyhow.workspace = true
once_cell.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
