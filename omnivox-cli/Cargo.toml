[package]
name = "omnivox-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Opt-in piper neural TTS backend (propagates to omnivox-tts).
# Requires cmake, a C++17 compiler, and network access on first build.
piper = ["omnivox-tts/piper"]

[[bin]]
name = "omnivox"
path = "src/main.rs"

[dependencies]
omnivox-core = { path = "../omnivox-core" }
omnivox-tts = { path = "../omnivox-tts" }
omnivox-audio = { path = "../omnivox-audio" }
anyhow.workspace = true
once_cell.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
