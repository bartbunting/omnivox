[package]
name = "omnivox-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Opt-in piper neural TTS backend (propagates to omnivox-tts).
# Requires cmake, a C++17 compiler, and network access on first build.
# omnivox-piper-sys is listed as a direct dep so DEP_PIPER_RPATH propagates
# to this crate's build.rs (DEP_ only works for direct dependencies).
piper = ["omnivox-tts/piper", "omnivox-piper-sys"]

[[bin]]
name = "omnivox"
path = "src/main.rs"

[dependencies]
omnivox-core = { path = "../omnivox-core" }
omnivox-tts = { path = "../omnivox-tts" }
omnivox-audio = { path = "../omnivox-audio" }
omnivox-piper-sys = { path = "../omnivox-piper-sys", optional = true }
anyhow.workspace = true
once_cell.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
